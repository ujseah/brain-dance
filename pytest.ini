[pytest]
# Brain Dance Test Configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async support
asyncio_mode = auto

# Custom markers
markers =
    gpu: marks tests requiring CUDA GPU (deselect with '-m "not gpu"')
    slow: marks tests as slow (deselect with '-m "not slow"')

# Default options
addopts = -v --tb=short

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
